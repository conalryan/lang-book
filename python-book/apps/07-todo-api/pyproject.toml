[project]
name = "todo-api"
version = "0.0.0"
description = "Capstone: a small REST API with FastAPI."
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.162",
  "uvicorn>=0.54",
]

[project.scripts]
todo-api = "todo_api.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
